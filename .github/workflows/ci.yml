name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DALAMUD_HOME: ${{ github.workspace }}\.dalamud

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # The unlock catalogue is GENERATED locally, by a developer with the game installed
      # (scripts/build-unlock-catalogue.mjs resolves names against the game's own sqpack), and
      # the result is committed. These runners have no game installation and never will, so CI
      # validates the committed files and never regenerates them. Every validator reads only what
      # is in the repository. See data/README.md.
      #
      # One step per validator, deliberately. Three `node` lines in one `run:` block on a Windows
      # runner is not three gates: the default shell is pwsh, and a NATIVE command's nonzero exit is
      # not a terminating error there unless $PSNativeCommandUseErrorActionPreference is set, which
      # defaults to false. Only the LAST line's exit code reaches the step, so the first two
      # validators could print "FAILED: N errors" into a green build. One step each cannot go wrong
      # that way whatever the shell does, and it names which validator failed in the job summary.
      - name: Validate the catalogue
        run: node data/validate-unlocks.mjs

      - name: Validate the catalogue's identities
        run: node data/validate-catalogue-identity.mjs

      - name: Validate the hunting targets
        run: node data/validate-hunting-targets.mjs

      # The completeness check. The catalogue's EXISTENCE set comes from one wiki guide, so
      # anything the guide omits this pipeline never learns about — a whole trophy-mount quest was
      # missing until another plugin's data revealed it. data/coverage.json is the game's own
      # answer, recorded beside the catalogue at generation time; this step is what stops the two
      # drifting apart. Its own step rather than a fourth line above, because what it fails on is
      # a different thing: not "is this file well formed" but "does it still describe the catalogue
      # sitting next to it".
      - name: Validate catalogue completeness
        run: node data/validate-coverage.mjs

      # repo.json is the Dalamud custom-repo manifest, not catalogue data, but the same "one step
      # per validator" reasoning above applies: this catches a malformed channel configuration
      # (see release.yml and promote.yml) before it ships, rather than it silently going inert the
      # way it already has once.
      - name: Validate the repo manifest
        run: node scripts/validate-repo-manifest.mjs

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Download Dalamud
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.DALAMUD_HOME }}" | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:TEMP\dalamud-latest.zip"
          Expand-Archive -Path "$env:TEMP\dalamud-latest.zip" -DestinationPath "${{ env.DALAMUD_HOME }}" -Force

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Format check
        run: dotnet format --verify-no-changes --verbosity diagnostic --exclude external/KamiToolKit

      - name: Build
        run: dotnet build --no-restore -c Release

      # tools/Wayfarer.CatalogueGen is deliberately outside Wayfarer.slnx: it needs a local game
      # installation to RUN, and it opts out of central package management and lock files, so it
      # cannot join the solution's locked-mode restore. That left ~1,400 lines uncompiled by
      # anything — including the reward join the committed catalogue is generated from and the
      # reward-kind to icon mapping — so a swapped branch or a mistyped row id was invisible until
      # somebody regenerated by hand. Compiling is not the same as testing it, but it is the
      # difference between a change being caught here and being caught in the shipped data.
      # Lumina ships with the Dalamud downloaded above.
      - name: Build the catalogue generator
        run: dotnet build tools/Wayfarer.CatalogueGen/Wayfarer.CatalogueGen.csproj -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      # The pattern list stays out of the public repository and matches are never echoed, so the
      # scanner itself cannot leak what it looks for. The switch is the other half: a fork's pull
      # request cannot read repository secrets, so on those the gate has nothing to scan with and
      # says so — but on a push or a same-repo pull request a missing secret is a broken gate, not a
      # clean tree, and it now fails instead of passing vacuously.
      - name: Hygiene check
        shell: pwsh
        env:
          WAYFARER_HYGIENE_PATTERNS: ${{ secrets.HYGIENE_PATTERNS }}
          WAYFARER_HYGIENE_REQUIRED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if ($env:WAYFARER_HYGIENE_REQUIRED -eq 'true') {
            ./scripts/check-hygiene.ps1 -RequirePatterns
          } else {
            ./scripts/check-hygiene.ps1
          }
