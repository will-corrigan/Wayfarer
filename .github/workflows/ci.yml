name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DALAMUD_HOME: ${{ github.workspace }}\.dalamud

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The unlock catalogue is GENERATED locally, by a developer with the game installed
      # (scripts/build-unlock-catalogue.mjs resolves names against the game's own sqpack), and
      # the result is committed. These runners have no game installation and never will, so CI
      # validates the committed files and never regenerates them. Every validator reads only what
      # is in the repository. See data/README.md.
      #
      # repo.json is the Dalamud custom-repo manifest. Its own step so a failure names itself:
      # this catches a malformed channel configuration
      # (see release.yml and promote.yml) before it ships, rather than it silently going inert the
      # way it already has once.
      - name: Validate the repo manifest
        run: node scripts/validate-repo-manifest.mjs

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Download Dalamud
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.DALAMUD_HOME }}" | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:TEMP\dalamud-latest.zip"
          Expand-Archive -Path "$env:TEMP\dalamud-latest.zip" -DestinationPath "${{ env.DALAMUD_HOME }}" -Force

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Format check
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Build
        run: dotnet build --no-restore -c Release

      # The generators under tools/ are deliberately outside Wayfarer.slnx: they need a local game
      # installation to RUN, and they opt out of central package management and lock files, so
      # they cannot join the solution's locked-mode restore. Compiling one here is not the same as
      # testing it, but it is the difference between a change being caught here and being caught
      # in the shipped data. Lumina ships with the Dalamud downloaded above.
      - name: Build the routing generator
        run: dotnet build tools/Wayfarer.RoutingGen/Wayfarer.RoutingGen.csproj -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      # The pattern list stays out of the public repository and matches are never echoed, so the
      # scanner itself cannot leak what it looks for. The switch is the other half: a fork's pull
      # request cannot read repository secrets, so on those the gate has nothing to scan with and
      # says so — but on a push or a same-repo pull request a missing secret is a broken gate, not a
      # clean tree, and it now fails instead of passing vacuously. Dependabot's own runs are the
      # other exception: GitHub withholds repository secrets from them too, and its commits are
      # machine-made, so the gate is not required there either.
      - name: Hygiene check
        shell: pwsh
        env:
          WAYFARER_HYGIENE_PATTERNS: ${{ secrets.HYGIENE_PATTERNS }}
          WAYFARER_HYGIENE_REQUIRED: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          if ($env:WAYFARER_HYGIENE_REQUIRED -eq 'true') {
            ./scripts/check-hygiene.ps1 -RequirePatterns
          } else {
            ./scripts/check-hygiene.ps1
          }
