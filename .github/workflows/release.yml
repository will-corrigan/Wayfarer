name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package (e.g. v0.1.1). Leave empty to run the normal release-please flow."
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    needs: release-please
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      DALAMUD_HOME: ${{ github.workspace }}\.dalamud

    steps:
      - name: Determine tag
        id: tag
        shell: pwsh
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}"
          if (-not $tag) { throw "No tag available to package" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Download Dalamud
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.DALAMUD_HOME }}" | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:TEMP\dalamud-latest.zip"
          Expand-Archive -Path "$env:TEMP\dalamud-latest.zip" -DestinationPath "${{ env.DALAMUD_HOME }}" -Force

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Package release asset
        shell: pwsh
        run: Copy-Item -Path "Wayfarer/bin/Release/Wayfarer/latest.zip" -Destination "Wayfarer.zip"

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" Wayfarer.zip --repo "${{ github.repository }}"

      - name: Update repo.json
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $version = $tag.TrimStart('v')
          # Dalamud requires the repo version to EXACTLY match the built manifest version,
          # which .NET always emits as four parts (e.g. 0.1.0.0 from <Version>0.1.0</Version>).
          if (($version -split "\.").Count -eq 3) { $version = "$version.0" }
          $repoTesting = $version
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/Wayfarer.zip"

          $repo = Get-Content repo.json -Raw | ConvertFrom-Json
          $repo[0].AssemblyVersion = $version
          $repo[0].TestingAssemblyVersion = $repoTesting
          $repo[0].DownloadLinkInstall = $downloadUrl
          $repo[0].DownloadLinkUpdate = $downloadUrl
          $repo[0].DownloadLinkTesting = $downloadUrl

          ConvertTo-Json -InputObject $repo -Depth 10 -AsArray | Set-Content -Path repo.json

      - name: Commit repo.json
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          $status = git status --porcelain -- repo.json
          if ($status) {
            git commit -m "chore: publish repo.json for ${{ steps.tag.outputs.tag }}"
            git push origin HEAD:main
          } else {
            Write-Host "repo.json unchanged, skipping commit"
          }
